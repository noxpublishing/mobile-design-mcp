name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install media tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo timeout 180s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo timeout 180s apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 ffmpeg
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - name: Install media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install media tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:publication
      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts
